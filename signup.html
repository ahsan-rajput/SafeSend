<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeSend | Sign up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bs-primary: #0F766E; --bs-primary-rgb: 15, 118, 110; --bs-link-color: #0F766E; --bs-link-hover-color: #115E59; }
    .btn-primary { --bs-btn-bg: #0F766E; --bs-btn-border-color: #0F766E; --bs-btn-hover-bg: #115E59; --bs-btn-hover-border-color: #115E59; --bs-btn-active-bg: #134E4A; --bs-btn-active-border-color: #134E4A; }
    .btn-outline-primary { --bs-btn-color: #0F766E; --bs-btn-border-color: #0F766E; --bs-btn-hover-bg: #0F766E; --bs-btn-hover-border-color: #0F766E; --bs-btn-active-bg: #115E59; }
  </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-md bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">SafeSend</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-md-center gap-md-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="create.html">Create link</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Log in</a></li>
          <li class="nav-item"><a class="btn btn-primary" href="signup.html">Sign up</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3">Create your account</h1>
            <p class="text-secondary">An account is optional. It lets you manage your links.</p>
            <form action="login.html">
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Full name</label>
                <input type="text" class="form-control" id="name" placeholder="Your name" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" placeholder="At least 8 characters" minlength="8" required>
              </div>
              <div class="mb-4">
                <label for="confirm" class="form-label fw-semibold">Confirm password</label>
                <input type="password" class="form-control" id="confirm" placeholder="Repeat your password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Sign up</button>
            </form>
            <p class="text-center text-secondary mt-3 mb-0">Already have an account? <a href="login.html">Log in</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="mt-auto bg-white border-top py-3">
    <div class="container small text-secondary">SafeSend: self-destructing secure sharing. Your content is encrypted in your browser.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
